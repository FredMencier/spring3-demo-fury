name: search-benchmark
http:
  host: http://host.docker.internal:8081
  sharedConnections: 10
phases:
  - rampUp:
      increasingRate:
        initialUsersPerSec: 1
        targetUsersPerSec: 10
        maxSessions: 50
        duration: 10s
        scenario:
          - search-fury-endpoint:
              - httpRequest:
                  headers:
                    accept: application/fury
                  GET: /accounts/search?accountNo=GE-0123456789
  - steadyState:
      constantRate:
        usersPerSec: 50
        maxSessions: 200
        startAfter: rampUp
        duration: 30s
        maxDuration: 45s
        scenario:
          - search-fury-endpoint:
              - httpRequest:
                  headers:
                    accept: application/fury
                  GET: /accounts/search?accountNo=GE-0123456789